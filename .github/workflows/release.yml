name: Release

# A `vX.Y.Z` tag and a GitHub release, cut from what is already on `main`, and
# — once it is switched on — the packages published to npm at that version.
#
# It does not decide anything. `pnpm run changeset:version` is run by hand and
# merged like any other change; this only notices that the version in the tree
# is one that has never been released, and marks the commit that carries it.
# Re-running it, or pushing anything else to `main`, releases nothing new.
#
# It does not gate anything either: it runs beside `ci.yml` rather than after
# it, so a tag says "this commit is what 0.2.0 is", not "this commit passed".
# What keeps `main` green is the pull request's own checks, which is where a
# failure can still be fixed without a tag already pointing at it. Publishing
# does check, though: it runs `pnpm verify`'s pack check again, and sends
# exactly the tarballs that check passed.
#
# Deliberately not the Changesets "Version Packages" bot. A pull request
# opened with `GITHUB_TOKEN` starts no workflows, so its own CI would never run
# — and once `verify` is a required status check, a pull request whose checks
# cannot run is one that can never be merged.

on:
    push:
        branches: [main]
    # "Run workflow" on `main` does what a push does. From a version's tag, it
    # publishes that version if publishing is on and npm does not have it yet:
    # the `tag` job starts that run itself, and it is how a version released
    # while publishing was off, or whose publish npm refused, gets published.
    # Anywhere else it does nothing at all.
    workflow_dispatch:

# Each job asks for what it needs.
permissions: {}

# Per commit, so nothing is ever canceled. A single `release` group would
# serialize these — which sounds right and is not: GitHub keeps one *pending*
# run per group and cancels the previous pending one, so two version bumps
# merged in quick succession would drop the first one's tag forever. Two runs
# racing for one tag is the harmless failure by comparison, and the step below
# is written to survive it. A run from a tag is grouped by its tag instead, so
# that two never publish one version at once.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref_type == 'tag' && github.ref || github.sha }}
    cancel-in-progress: false

jobs:
    tag:
        # A push is always to `main`; this keeps "Run workflow" on a branch to
        # it too. A run from a tag only publishes.
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # The tag, the release, and the run from the tag that publishes it.
        # Nothing else, and no pull-request scopes.
        permissions:
            contents: write
            actions: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Tags, so "has this version been tagged already?" can be
                  # answered without asking the API.
                  fetch-depth: 0

            - name: Read the version
              id: version
              run: |
                  set -eu
                  # The seven are `fixed` in .changeset/config.json, so any of
                  # them answers — but only while that holds, and a hand-edited
                  # `package.json` is exactly how it would stop holding without
                  # anyone noticing. Checked rather than assumed.
                  version=""
                  for manifest in packages/*/package.json; do
                    this=$(node -p "require('./$manifest').version")
                    if [ -z "$version" ]; then
                      version=$this
                      first=$manifest
                    elif [ "$this" != "$version" ]; then
                      echo "::error::$manifest is $this but $first is $version." \
                           "The packages are fixed to one version; nothing is released until they agree."
                      exit 1
                    fi
                  done
                  # Where the packages started, before anything was released.
                  if [ "$version" = "0.0.0" ]; then
                    echo "The packages are at 0.0.0, which is no release. Nothing to do."
                    exit 0
                  fi
                  printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

            - name: Tag and release, if this version is new
              id: release
              if: steps.version.outputs.value != ''
              env:
                  # Through the environment rather than interpolated into the
                  # script. The value comes from a file in the repository, so
                  # it is already reviewed code — but a workflow that pastes
                  # file contents into a shell is a habit worth not having.
                  VERSION: ${{ steps.version.outputs.value }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -eu
                  tag="v$VERSION"

                  # The release, not the tag, is what says this version is out.
                  # Asking about the tag instead would make a run that pushed
                  # the tag and then failed to create the release unrepeatable:
                  # every later run would short-circuit on the tag and the
                  # release would never appear. Every step below is safe to run
                  # again.
                  if gh release view "$tag" >/dev/null 2>&1; then
                    echo "$tag is already released. Nothing to do."
                    exit 0
                  fi

                  if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                    # The commit that set this version, which is the last to
                    # change a manifest's `"version"` line: not necessarily
                    # this run's, since a pull request merged just after the
                    # version one, or a run that retries a failed one, has
                    # this version too, with changes that are not in it.
                    commit=$(git log -1 --format=%H -G'"version": ' -- 'packages/*/package.json')
                    git -c user.name='github-actions[bot]' \
                        -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                        tag -a "$tag" "$commit" -m "$tag"
                    # Another run for another commit may have pushed the same
                    # tag between the check above and here. That is a race this
                    # one lost, not a failure: the tag exists, which is what it
                    # wanted, and the release below is created against it.
                    if ! git push origin "$tag"; then
                      git ls-remote --exit-code --tags origin "$tag" >/dev/null
                      echo "$tag was pushed by another run first."
                    fi
                  fi

                  # What each package's CHANGELOG.md says of its own for this
                  # version, each said once; the script says what it leaves out.
                  notes="$RUNNER_TEMP/notes.md"
                  node scripts/releaseNotes.mjs "$VERSION" > "$notes"
                  # It always says something, so nothing means it did not run.
                  if [ ! -s "$notes" ]; then
                    echo "::error::scripts/releaseNotes.mjs wrote nothing for $VERSION."
                    exit 1
                  fi

                  gh release create "$tag" --title "$tag" --notes-file "$notes"
                  echo 'released=true' >> "$GITHUB_OUTPUT"

            # Publishing runs from the tag, in a run of its own, because npm's
            # provenance names the commit a run is of: that run is of the
            # commit the tag names, which this one need not be. A dispatch
            # made with `GITHUB_TOKEN` does start a run, unlike its pushes.
            - name: Start the run that publishes it, if publishing is on
              if: steps.release.outputs.released == 'true' && vars.NPM_PUBLISH == 'true'
              env:
                  VERSION: ${{ steps.version.outputs.value }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "v$VERSION"

    # Publishing, in a run from a version's tag, and only while it is switched
    # on: the repository variable `NPM_PUBLISH` set to `true`, once the
    # repository is public (provenance needs that) and npm will take the
    # packages from it — through a token for a package's first version, and
    # through trusted publishing from then on (`.changeset/README.md` says
    # how).
    #
    # Two jobs, so that the credential to publish is held only where nothing
    # but npm and the kit's own script runs. `pack` installs, builds and checks
    # with neither the OIDC token nor the secret; `publish` gets the tarballs
    # `pack` checked, and installs and builds nothing.
    pack:
        if: github.ref_type == 'tag' && vars.NPM_PUBLISH == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        outputs:
            version: ${{ steps.release.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # `main`'s history, to find the tag's commit on it.
                  fetch-depth: 0
                  persist-credentials: false

            # Only a release is published: a tag on a commit merged to `main`,
            # holding the version it names, that the `tag` job released. A tag
            # pushed by hand onto a branch is none of those.
            - name: Check the tag is a release
              id: release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -eu
                  version=${GITHUB_REF_NAME#v}
                  for manifest in packages/*/package.json; do
                    this=$(node -p "require('./$manifest').version")
                    if [ "$this" != "$version" ]; then
                      echo "::error::$manifest is $this, so $GITHUB_REF_NAME is no release of it."
                      exit 1
                    fi
                  done
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                    echo "::error::$GITHUB_REF_NAME is not on main, so it was never released."
                    exit 1
                  fi
                  if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null; then
                    echo "::error::$GITHUB_REF_NAME has no GitHub release, so it was never released."
                    exit 1
                  fi
                  printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

            - run: corepack enable

            # No cache, as npm advises for a release: what is published is
            # built from what the lockfile names, fetched now, not from a store
            # an earlier run left.
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            - run: pnpm install --frozen-lockfile
            - run: pnpm build

            # The same check `pnpm verify` runs, keeping the tarballs it passed.
            - run: node scripts/packCheck.mjs --keep "$RUNNER_TEMP/tarballs"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: tarballs
                  path: ${{ runner.temp }}/tarballs
                  if-no-files-found: error

    publish:
        needs: pack
        runs-on: ubuntu-latest
        timeout-minutes: 15
        # Where the credential is: the token, while there is one, is this
        # environment's secret, and npm's trusted publishing names it. Its
        # deployment rule admits only `v*` tags, so a run from a branch, with
        # its own copy of this file, can publish nothing.
        environment: npm
        permissions:
            contents: read
            # The OIDC token trusted publishing signs in with, and npm's
            # provenance statement is signed with.
            id-token: write
        steps:
            # For the script and `.nvmrc`; nothing in it is installed or built.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  # Writes the `.npmrc` that hands `NODE_AUTH_TOKEN` to the
                  # registry, while there is one.
                  registry-url: https://registry.npmjs.org

            # Trusted publishing needs npm 11.5.1 or later, and its dist-tags
            # 11.21.0; Node 22 comes with npm 10
            # (https://docs.npmjs.com/trusted-publishers). Pinned, as the
            # actions are.
            - run: npm install --global npm@11.21.1

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: tarballs
                  path: ${{ runner.temp }}/tarballs

            - name: Publish what npm does not have
              env:
                  VERSION: ${{ needs.pack.outputs.version }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: node scripts/publish.mjs "$RUNNER_TEMP/tarballs" "$VERSION"
